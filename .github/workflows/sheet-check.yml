# Manual check of the Google Sheet script (catalog + analytics), run from GitHub's servers.
name: sheet-check
on:
  push:
    branches: [sheet-check]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call the Sheet script
        run: |
          URL=$(grep -o 'https://script.google.com/[^"]*' src/ff-script-url.js)
          echo "== catalog (first 300 chars)"
          curl -sSL -m 40 "$URL?action=catalog" | head -c 300; echo
          echo "== analytics test (plain GET, like a browser)"
          curl -sSL -m 40 -w '\nHTTP %{http_code} final=%{url_effective}\n' "$URL?action=analytics&event=widget_open&sid=gh-check-1" | head -c 600; echo
          echo "== analytics test without following redirects"
          curl -sS -m 40 -o /dev/null -w 'HTTP %{http_code} location=%{redirect_url}\n' "$URL?action=analytics&event=persona_feedback&sid=gh-check-2&perfume=yes"
          echo "== same request with a browser user-agent"
          curl -sSL -m 40 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36' "$URL?action=analytics&event=widget_open&sid=gh-check-3" | head -c 300; echo
